<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تصدير الماعز القزم لجميع دول الخليج</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Cairo', 'sans-serif'],
            },
            colors: {
              brand: {
                wa: '#25D366',
                waHover: '#20bd5a',
                gold: '#d97706',
              }
            }
          }
        }
      }
    </script>

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .pulse-glow {
            box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6);
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.6);
            }
            70% {
                transform: scale(1.02);
                box-shadow: 0 0 0 16px rgba(37, 211, 102, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
            }
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between items-center relative overflow-hidden">

    <!-- Background Ambient Glow -->
    <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <script>
        // ==========================================
        // ⚙️ إعدادات الواتساب - عدّل الرقم والرسالة من هنا
        // ==========================================
        const CONFIG = {
            phoneNumber: "966500000000", // أدخل الرقم بالصيغة الدولية بدون (+) أو (00)
            defaultMessage: "السلام عليكم، أرغب في الاستفسار عن تصدير الماعز القزم إلى دول الخليج."
        };

        function redirectToWhatsApp() {
            const message = encodeURIComponent(CONFIG.defaultMessage);
            const url = `https://wa.me/${CONFIG.phoneNumber}?text=${message}`;
            window.open(url, '_blank');
        }
    </script>

    <!-- Header Section -->
    <header class="w-full max-w-md pt-8 px-6 text-center z-10">
        <div class="inline-flex items-center gap-2 px-3 py-1 bg-emerald-950/80 border border-emerald-500/30 rounded-full text-emerald-400 text-xs font-semibold mb-4 backdrop-blur-sm">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            خدمة توريد وشحن معتمدة
        </div>
        <h1 class="text-2xl sm:text-3xl font-black text-white leading-tight">
            تصدير الماعز القزم لجميع دول الخليج
        </h1>
    </header>

    <main class="w-full max-w-md px-6 py-12 flex flex-col items-center justify-center my-auto z-10">
        
        <div class="w-full bg-slate-800/80 border border-slate-700/80 rounded-2xl p-6 text-center shadow-2xl backdrop-blur-md">
            
            <div class="w-16 h-16 bg-brand-wa/10 text-brand-wa rounded-full flex items-center justify-center mx-auto mb-5 border border-brand-wa/20">
                <i class="fa-brands fa-whatsapp text-3xl"></i>
            </div>

            <h2 class="text-lg font-bold text-slate-100 mb-2">
                طلب واستفسارات المبيعات
            </h2>
            <p class="text-xs text-slate-400 mb-6">
                اضغط على الزر أدناه للتواصل المباشر معنا عبر الواتساب
            </p>

            <button onclick="redirectToWhatsApp()" 
                    class="pulse-glow w-full bg-brand-wa hover:bg-brand-waHover text-white font-extrabold py-4 px-6 rounded-xl shadow-lg flex items-center justify-center gap-3 transition-all transform active:scale-95 text-lg">
                <i class="fa-brands fa-whatsapp text-2xl"></i>
                <span>تواصل عبر الواتساب</span>
            </button>
            
        </div>

    </main>

    <footer class="w-full max-w-md pb-6 px-6 text-center text-xs text-slate-500 z-10">
        جميع الحقوق محفوظة &copy; <script>document.write(new Date().getFullYear())</script> - تصدير الماعز القزم
    </footer>

</body>
</html>
